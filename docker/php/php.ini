date.timezone = UTC
memory_limit = 256M

; CMS uploads (S12, #25): one file per request, photos up to 10 MB, PDFs up to 15 MB, checked by the
; app. post_max_size leaves room for the multipart overhead; nginx's client_max_body_size matches it.
; Variant generation takes seconds, hence the 60 s. #20 sets production's limits (its PD13 plans
; max_execution_time = 120).
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 60

; Xdebug only starts when the request carries XDEBUG_TRIGGER (query, cookie or env).
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
