server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # One CMS upload per request (S12, #25), well above the photo and PDF limits, which the app checks.
    # Matches PHP's post_max_size (26M), so a larger body is nginx's own 413 (the island reports too
    # large); nginx's 1 MB default would answer 413 before PHP sees a photo.
    client_max_body_size 26m;

    # Compress text responses as any production host does; without it Lighthouse measures the listing's
    # ~470 KB HTML uncompressed (#7). text/html is always included.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Only the front controller is executable.
    location ~ \.php$ {
        return 404;
    }
}
