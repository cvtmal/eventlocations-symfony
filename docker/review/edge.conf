# review-demo (compose.review.yaml, `make review-up`): the review stack's only way in, published on 127.0.0.1:8098,
# where cloudflared's quick tunnel and a local browser arrive. In front of the stack's own nginx, so it covers every
# response, the files nginx serves itself (/assets/, /media/) and its errors included:
# - X-Robots-Tag noindex, nofollow (the app sets the same in review mode; hidden here so it is sent once);
# - the tunnel's https goes on as X-Forwarded-Proto (the app trusts private_ranges), so links and redirects are
#   https on the tunnel host; a local request without the header stays http;
# - the tunnel's plain http (Cloudflare does not upgrade a quick tunnel) is sent to https.
map $http_x_forwarded_proto $review_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    # The inner nginx's own limit (docker/nginx/default.conf), so a CMS upload is not refused here first.
    client_max_body_size 26m;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://nginx:80;
        # 1.1, or the inner nginx does not gzip (gzip_http_version).
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $review_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
