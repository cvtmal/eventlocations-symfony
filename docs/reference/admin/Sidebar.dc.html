<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","locations","landing","blocks","companies","contacts","deals","inbox","tasks","users","audit","templates"],"default":"dashboard"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const keys = ['dashboard','locations','landing','blocks','companies','contacts','deals','inbox','tasks','users','audit','templates'];
    const base = 'display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; text-decoration: none;';
    const s = {};
    const i = {};
    keys.forEach((k) => {
      s[k] = base + (k === active ? ' background: #2F2F2F; color: #FFFFFF; font-weight: 600;' : ' color: #D6D3CE; font-weight: 400;');
      i[k] = k === active ? 'color: #FF5A75; flex: none' : 'color: #A9A6A0; flex: none';
    });
    return { s, i };
  }
}
</script>
