services:
  php:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - php

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      retries: 10
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAILPIT_HOST_PORT:-8025}:8025"

  # —— Tooling only (`docker compose --profile tools …`; never started by `make up`) ——
  lighthouse:
    build: ./docker/lighthouse
    profiles: [tools]
    network_mode: "service:nginx"
    volumes:
      - ./var/lighthouse:/reports

  # Builds and tests the back office's Vue islands (admin-ui/). Runs as root so `npm ci` can write in a
  # CI checkout owned by another uid; nothing reads admin-ui/node_modules from the php container.
  node:
    image: node:26-alpine
    profiles: [tools]
    working_dir: /app/admin-ui
    volumes:
      - .:/app

  # Pinned by digest: `latest` of 2026-10-12, multi-arch (native arm64). The newest dated tag, 24.10.17,
  # is amd64-only and predates `commandfor`/`command`.
  vnu:
    image: ghcr.io/validator/validator:latest@sha256:8f21030474e68e06905cfa801b37376e99c0e37867c653c5b6cd7e2dcaf3f503
    profiles: [tools]
    network_mode: "service:nginx"
    entrypoint: ["/usr/local/bin/vnu"]
    # vnu refuses to fetch localhost ("Forbidden host"), so `make validate-html` saves the page here first.
    volumes:
      - ./var/validate:/work:ro

volumes:
  database_data:
