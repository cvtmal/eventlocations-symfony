# Strings of the Inquiries module. Keys: <context>.<description>.
form:
    heading: '{name} kontaktieren'
    promise:
        free: Kostenlos
        noncommittal: Unverbindlich
        direct: Direkt zur Location
    field:
        event_type: Anlass
        guests: Anzahl Gäste
        event_date: Wunschtermin
        date_flexible: Datum ist flexibel
        start_time: Beginn
        catering_wish: Catering
        budget: Budget in CHF
        company: Firma
        message: Deine Nachricht
        first_name: Vorname
        last_name: Name
        email: E-Mail
        phone: Telefon
        website: Dieses Feld bitte leer lassen
    optional: (optional)
    placeholder:
        choose: Bitte wählen
        catering_open: Noch offen
    submit: Anfragen
    privacy: Deine Angaben gehen direkt an {name}.
    privacy_link: Datenschutz
    undelivered: Deine Anfrage ist bei uns gespeichert, konnte aber gerade nicht an {name} zugestellt werden. Wir kümmern uns darum und stellen sie so bald wie möglich zu. Du musst nichts weiter tun.
    message_default: "Liebes {name}-Team,\n\nwir planen einen Anlass und interessieren uns für {name}. Ist unser Wunschtermin noch frei?\n\nHerzliche Grüsse"
    error:
        summary: Bitte prüfe deine Angaben.
        too_fast: Das ging sehr schnell. Bitte sende das Formular noch einmal ab.
        rate_limited: Du hast gerade mehrere Anfragen gesendet. Bitte versuch es später noch einmal.
        not_accepted: Diese Location nimmt gerade keine Anfragen entgegen.
        date_past: Der Wunschtermin liegt in der Vergangenheit.
        date_missing: Bitte gib einen Wunschtermin an oder wähle «Datum ist flexibel».
        budget_range: Bitte gib ein Budget zwischen 1 Franken und 1 Million Franken an.
        unknown_term: Bitte wähle Anlass und Catering aus der Liste.
        guests_range: Bitte gib zwischen 1 und 5000 Gäste an.
confirmation:
    heading: Danke! Deine Anfrage ist unterwegs.
    text: '{name} hat deine Anfrage erhalten und antwortet dir direkt. Eine Kopie findest du in deinem Postfach.'
    again: Weitere Anfrage senden
email:
    date_flexible: flexibel
    date_and_flexible: '{date} (flexibel)'
    start_time: '{time} Uhr'
    budget: CHF {amount}
    fact:
        event_type: Anlass
        company: Firma
        guests: Gäste
        date: Wunschtermin
        start_time: Beginn
        catering: Catering-Wunsch
        budget: Budget
        name: Name
        email: E-Mail
        phone: Telefon
    venue:
        subject: 'Neue Anfrage für {venue}: {name}, {event_type}, {date}, {guests} Gäste'
        preheader: '{name} fragt für {guests} Gäste an.'
        greeting: Neue Anfrage für {venue}
        intro: '{name} hat über deine-eventlocation.ch diese Anfrage gesendet.'
        reply_note: Antworte direkt auf diese E-Mail, deine Antwort geht an {name}.
    guest:
        subject: Deine Anfrage an {venue}
        preheader: Deine Anfrage ist an {venue} gegangen.
        greeting: Danke, {name}!
        intro: Deine Anfrage ist an {venue} gegangen. Das hast du gesendet.
        answer_note: '{venue} antwortet dir direkt.'
        button: Zur Location
    stuck:
        subject: 'Anfragen nicht zugestellt: {count}'
        greeting: Hallo
        intro: Diese Anfragen haben ihre Location nicht erreicht. Öffne sie im CRM und sende sie erneut.
        status:
            failed: Zustellung fehlgeschlagen
            pending: Zustellung ausstehend
        line: '{venue} (Nr. {number}), eingegangen {date}'
        open: Im CRM öffnen
        note: Jede Anfrage erscheint nur einmal in dieser Meldung.
    # G16: the one feedback mail a week after a delivered inquiry (FeedbackMailer). {count} is the number of inquiries
    # of this address in the run, {venue} the first one's venue.
    feedback:
        subject: '{count, plural, one {Hat es mit {venue} geklappt?} other {Hat es mit deinen Anfragen geklappt?}}'
        preheader: Zwei kurze Fragen zu deiner Anfrage, freiwillig und in einer Minute beantwortet.
        greeting: 'Hallo {name}'
        intro: '{count, plural, one {Vor kurzem hast du über deine-eventlocation.ch eine Anfrage an {venue} geschickt.} other {Vor kurzem hast du über deine-eventlocation.ch # Locations angefragt.}}'
        questions: Hat sich die Location bei dir gemeldet, und hat es geklappt? Deine Antwort ist freiwillig und hilft uns, die Locations auf deine-eventlocation.ch zu verbessern.
        button: Rückmeldung geben
        button_for: 'Rückmeldung zu {venue}'
        note: Wir fragen zu jeder Anfrage nur einmal. Die Location erfährt nur, wie viele Rückmeldungen sie bekommen hat, nicht was du geantwortet hast.
        opt_out_lead: Keine solchen Fragen mehr nach einer Anfrage?
        opt_out_link: Hier abmelden
# G16: the feedback page (InquiryFeedbackController, templates/inquiries/feedback.html.twig), one block per state.
feedback:
    to_home: Zur Startseite
    question:
        venueReplied: 'Hat sich {venue} bei dir gemeldet?'
        outcome: Hat es geklappt?
    answer:
        'yes': Ja
        'no': Nein
    outcome:
        'yes': Ja, der Anlass findet dort statt
        'no': Nein
        open: Noch offen
    form:
        title: Deine Rückmeldung
        heading: 'Wie lief es mit {venue}?'
        text: 'Zwei kurze Fragen, freiwillig. {venue} sieht nur, wie viele Rückmeldungen es gab, nicht deine Antworten.'
        submit: Rückmeldung senden
        opt_out: Keine solchen Fragen mehr nach einer Anfrage
    done:
        title: Danke
        heading: Danke für deine Rückmeldung!
        text: Wir haben sie gespeichert. Hat sich etwas geändert? Über denselben Link kannst du deine Antwort anpassen.
        change: Antwort ändern
    opt_out_ask:
        title: Abmelden
        heading: Keine Fragen mehr nach einer Anfrage?
        text: Dann schicken wir dir nach einer Anfrage keine solche Frage mehr. Deine Anfragen erreichen die Locations wie bisher.
        submit: Abmelden
    opt_out_done:
        title: Abgemeldet
        heading: Du bist abgemeldet
        text: 'Wir schicken dir nach einer Anfrage keine solche Frage mehr. Hast du dich vertan? Schreib uns an {email}.'
    unknown:
        title: Link ungültig
        heading: Dieser Link gilt nicht mehr
        text: 'Vielleicht ist die Anfrage schon gelöscht. Fragen? Schreib uns an {email}.'
