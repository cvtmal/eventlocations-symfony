# Strings of the Shared module. Keys: <context>.<description>.
email:
    footer: Hochzeitslocation · hochzeitslocation.ch
legal:
    nav_label: Rechtliches
    imprint:
        link: Impressum
        title: Impressum
        page_title: Impressum | Hochzeitslocation
        meta_description: Impressum von Hochzeitslocation, betrieben von der Pick n Roll GmbH in Zürich.
        operator: Betreiberin
        uid: 'UID-Nr.: {uid}'
        contact: Kontakt
    privacy:
        link: Datenschutz
        title: Datenschutz
        page_title: Datenschutz | Hochzeitslocation
        meta_description: Welche Daten Hochzeitslocation bearbeitet, wofür, wie lange und welche Rechte du hast.
        # TODO owner: review the whole text before go-live (T7). Draft, not legal advice.
        updated: 'Stand: Oktober 2026'
        intro: Hier steht, welche Personendaten wir bearbeiten, wofür und wie lange. Du kannst die Website ohne Konto nutzen. Wir setzen keine Analyse- oder Werbedienste ein, und die Schriften liefern wir selbst aus.
        controller:
            title: Verantwortliche Stelle
            text: 'Verantwortlich für die Datenbearbeitung ist:'
        inquiry:
            title: Anfragen an eine Location
            data: 'Wenn du eine Location anfragst, bearbeiten wir deine Angaben: Anlass, Anzahl Gäste, Wunschdatum, Nachricht, Vor- und Nachname, E-Mail-Adresse und Telefonnummer, falls du sie angibst.'
            purpose: Wir leiten sie per E-Mail an die angefragte Location weiter, damit sie dir antworten kann, und schicken dir eine Kopie an die angegebene E-Mail-Adresse. Die Location bearbeitet deine Anfrage danach in eigener Verantwortung.
            # TODO owner: #20 must schedule app:inquiries:purge daily, or this sentence is false (T6).
            retention: 'Wir speichern Anfragen zusammen mit dem Versandstatus und löschen sie {months, plural, one {# Monat} other {# Monate}} nach dem Eingang. E-Mails, die eine Location erhalten hat, liegen bei der Location und werden davon nicht berührt.'
        merkliste:
            title: Merkliste und Cookie
            text: 'Die Merkliste funktioniert ohne Konto. Dafür setzen wir ein einziges Cookie mit dem Namen «merkliste». Es merkt sich, welche Locations du gespeichert hast. Es ist für diese Funktion nötig, darum fragen wir nicht nach deiner Einwilligung.'
            content: Das Cookie enthält nur öffentliche Nummern von Locations, höchstens 100, und nichts, was dich als Person erkennbar macht.
            # The one place for the lifetime (#13): days come from LegalController::MERKLISTE_DAYS.
            lifetime: 'Es bleibt bis zu {days} Tage ab der letzten Änderung gespeichert. Leerst du die Merkliste, wird es gelöscht. In Safari und in Browsern auf iOS kann die Liste schon nach 7 Tagen ohne Änderung verschwinden.'
            processing: Dein Browser schickt das Cookie bei jedem Aufruf der Website mit, gelesen wird es nur für die Merkliste. Wir speichern die Liste nicht auf dem Server und geben sie weder an Locations noch an Dritte weiter.
            control: Du entfernst Einträge auf der Merkliste selbst oder löschst das Cookie in deinem Browser. Die Liste gilt pro Browser und Gerät.
        abuse:
            title: Schutz vor Missbrauch
            # TODO owner: #20 must schedule cache:pool:prune, or expired counters stay on the server (T10).
            text: 'Damit Formular und Telefonnummern nicht automatisiert abgegriffen werden, zählen wir Anfragen pro IP-Adresse. Dafür legen wir zu deiner IP-Adresse einen Zähler im Zwischenspeicher des Servers ab. Er läuft spätestens zwei Stunden nach deiner letzten Anfrage ab, abgelaufene Zähler löschen wir regelmässig. Mit deiner Anfrage speichern wir die IP-Adresse nicht.'
        hosting:
            title: Hosting und Datenbank
            # TODO owner: confirm Hostpoint's company name, data location and web log retention in #20 (T2).
            web: Die Website läuft bei der Hostpoint AG in der Schweiz. Beim Aufruf entstehen technisch nötige Server-Protokolle.
            # TODO owner: name the state once #20 picks Neon's region (nDSG Art. 19 para. 4), and check Neon's data processing terms (T1).
            database: Die Datenbank mit den Anfragen betreibt Neon in einem Rechenzentrum in der EU.
            # TODO owner: confirm the production mail provider in #20 (T3).
            mail: E-Mails verschicken wir über den Mailserver von Hostpoint.
        maps:
            title: Karten von Google Maps
            # TODO owner: check Google's controller and address against policies.google.com/privacy before go-live (T8, #15).
            text: Auf der Seite einer Location kann eine Karte von Google Maps erscheinen, ein Dienst der Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Wir laden sie erst, wenn du auf «Karte laden» klickst. Vorher wird nichts an Google übertragen. Mit dem Klick ruft dein Browser die Karte direkt bei Google ab; dabei erhält Google deine IP-Adresse und die Adresse unserer Website, und Google kann Cookies setzen.
            policy: 'Es gelten die Datenschutzbestimmungen von Google:'
            policy_link: policies.google.com/privacy
        links:
            title: Links zu anderen Anbietern
            text: 'Die Seiten der Locations verlinken auf deren Websites und Instagram-Profile, das Teilen über WhatsApp führt zu WhatsApp. Der Link «Auf Google Maps öffnen» auf der Seite einer Location führt zu Google Maps. Diese Dienste werden erst geladen, wenn du den Link anklickst; ab dann gelten ihre Datenschutzbestimmungen.'
        staff:
            title: Interner Bereich
            text: Unser interner Bereich ist nur für unsere Mitarbeitenden. Nur dort gibt es eine Anmeldung und ein Sitzungs-Cookie.
        rights:
            title: Deine Rechte
            text: Du kannst Auskunft über deine Daten verlangen und sie berichtigen oder löschen lassen. Schreib uns dafür an die oben genannte E-Mail-Adresse. Du kannst dich auch an den Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) wenden.
