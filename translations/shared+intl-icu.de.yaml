# Strings of the Shared module. Keys: <context>.<description>.
email:
    footer: deine-eventlocation.ch
    opt_out:
        lead: 'Du möchtest keine Mails und Briefe mehr von uns?'
        link: Hier abmelden
        text: 'Du möchtest keine Mails und Briefe mehr von uns? Hier abmelden: {url}'
opt_out:
    to_home: Zur Startseite
    ask:
        title: Abmelden
        heading: Keine Mails und Briefe mehr von uns?
        text: 'Mit einem Klick nehmen wir dich aus unseren Werbe-Mails und Briefen. Das gilt dauerhaft. Wenn du dich abmeldest, schreibt unser Team niemandem bei dieser Location mehr E-Mails. Automatische E-Mails zu einem Konto oder einem bestehenden Vertrag, zum Beispiel Anfragen für die Location oder die Erinnerung vor Ablauf eines Pro-Eintrags, kommen weiterhin.'
        submit: Ja, abmelden
    done:
        title: Abgemeldet
        heading: Du bist abgemeldet
        text: 'Wir schreiben dir keine Werbe-Mails und Briefe mehr. Ab jetzt schreibt unser Team niemandem bei dieser Location mehr E-Mails. Automatische E-Mails zu einem Konto oder einem bestehenden Vertrag, zum Beispiel Anfragen für die Location oder die Erinnerung vor Ablauf eines Pro-Eintrags, kommen weiterhin. Fragen? Schreib uns an {email}.'
    unknown:
        title: Link ungültig
        heading: Dieser Link gilt nicht
        text: 'Wir können diesen Abmelde-Link nicht zuordnen. Schreib uns an {email}, dann nehmen wir dich von unserer Liste.'
legal:
    nav_label: Rechtliches
    imprint:
        link: Impressum
        title: Impressum
        page_title: Impressum | deine-eventlocation.ch
        meta_description: Impressum von deine-eventlocation.ch, mit Betreiberin und Kontakt.
        operator: Betreiberin
        uid: 'UID-Nr.: {uid}'
        contact: Kontakt
    privacy:
        link: Datenschutz
        title: Datenschutz
        page_title: Datenschutz | deine-eventlocation.ch
        meta_description: Welche Daten deine-eventlocation.ch bearbeitet, wofür, wie lange und welche Rechte du hast.
        # TODO owner: review the whole text before go-live (T7). Draft, not legal advice.
        updated: 'Stand: November 2026'
        intro: Hier steht, welche Personendaten wir bearbeiten, wofür und wie lange. Du kannst die Website ohne Konto nutzen. Wir setzen keine Analyse- oder Werbedienste ein, und die Schriften liefern wir selbst aus.
        controller:
            title: Verantwortliche Stelle
            text: 'Verantwortlich für die Datenbearbeitung ist:'
        inquiry:
            title: Anfragen an eine Location
            data: 'Wenn du eine Location anfragst, bearbeiten wir deine Angaben: Anlass, Anzahl Gäste, Wunschdatum, Nachricht, Vor- und Nachname, E-Mail-Adresse und Telefonnummer, falls du sie angibst.'
            purpose: Wir leiten sie per E-Mail an die angefragte Location weiter, damit sie dir antworten kann, und schicken dir eine Kopie an die angegebene E-Mail-Adresse. Die Location bearbeitet deine Anfrage danach in eigener Verantwortung.
            # TODO owner: #20 must schedule app:inquiries:purge daily, or this sentence is false (T6).
            retention: 'Wir speichern Anfragen zusammen mit dem Versandstatus und löschen sie {months, plural, one {# Monat} other {# Monate}} nach dem Eingang. E-Mails, die eine Location erhalten hat, liegen bei der Location und werden davon nicht berührt.'
        crm:
            title: Kontakte von Locations
            # Since #55 a contact is a row on its Location's card: a removal deletes that row only. venues.contact_person and venues.inquiry_email stay, because Crm writes no venue data; staff remove that copy by hand in the CMS.
            data: 'Wenn du für eine Location arbeitest, bearbeiten wir deine geschäftlichen Kontaktdaten: Name, Rolle, E-Mail-Adresse, Telefonnummer und deine Location. Dazu kommen unsere Notizen zur Zusammenarbeit mit deiner Location.'
            purpose: Wir nutzen sie, um die Zusammenarbeit mit den Locations zu pflegen. Diese Daten sind nur in unserem internen Bereich sichtbar und liegen in derselben Datenbank wie die Anfragen.
            retention: Wir speichern sie, solange wir sie für die Zusammenarbeit brauchen. Verlangst du die Löschung, löschen wir sie früher.
        report:
            # G2 takedown-form-finish: the PO's text, word for word. The three years are
            # EraseModerationComplainants::RETENTION_YEARS (app:venues:erase-complainants, nightly in bin/cron-daily); the two hours are the content_report limiter's
            # hashed key (ClientIpKey; a 1-hour sliding window keeps its state for two windows).
            title: Meldungen zu Inhalten
            data: 'Über das Formular «Inhalt melden» kannst du uns ein Foto, einen Eintrag oder falsche Angaben melden, zum Beispiel wenn ein Foto ohne Erlaubnis gezeigt wird. Dafür bearbeiten wir deinen Namen, deine E-Mail-Adresse, deine Nachricht, die Seite, von der aus du meldest, und deine Bestätigung, dass du in gutem Glauben meldest. Mit deiner Meldung speichern wir deine IP-Adresse nicht. Zum Schutz vor Missbrauch halten wir höchstens zwei Stunden lang einen Prüfwert fest, aus dem sich deine IP-Adresse nicht zurückrechnen lässt.'
            process: 'Du erhältst eine Eingangsbestätigung per E-Mail. Ein gemeldetes Foto blenden wir aus, bis wir entschieden haben. Wir prüfen die Meldung, entfernen den Inhalt oder lassen ihn stehen und melden uns bei Bedarf bei dir. Deinen Namen und deine E-Mail-Adresse geben wir nicht an die Location weiter, ausser du bist damit einverstanden.'
            retention: 'Wir bewahren eine Meldung auf, solange wir sie bearbeiten, und danach höchstens drei Jahre ab unserem Entscheid, damit wir bei einem Streit über Bildrechte belegen können, was wir wann getan haben. Danach löschen wir deinen Namen, deine E-Mail-Adresse und deine Nachricht.'
        merkliste:
            title: Merkliste und Cookie
            text: 'Die Merkliste funktioniert ohne Konto. Dafür setzen wir ein einziges Cookie mit dem Namen «merkliste». Es merkt sich, welche Locations du gespeichert hast. Es ist für diese Funktion nötig, darum fragen wir nicht nach deiner Einwilligung.'
            content: Das Cookie enthält nur öffentliche Nummern von Locations, höchstens 100, und nichts, was dich als Person erkennbar macht.
            # The one place for the lifetime (#13): days come from LegalController::MERKLISTE_DAYS.
            lifetime: 'Es bleibt bis zu {days} Tage ab der letzten Änderung gespeichert. Leerst du die Merkliste, wird es gelöscht. In Safari und in Browsern auf iOS kann die Liste schon nach 7 Tagen ohne Änderung verschwinden.'
            processing: Dein Browser schickt das Cookie bei jedem Aufruf der Website mit, gelesen wird es nur für die Merkliste. Wir speichern die Liste nicht auf dem Server und geben sie weder an Locations noch an Dritte weiter.
            control: Du entfernst Einträge auf der Merkliste selbst oder löschst das Cookie in deinem Browser. Die Liste gilt pro Browser und Gerät.
        stats:
            title: Statistik
            body: 'Wir zählen ohne Cookies und ohne Drittanbieter, wie oft Seiten aufgerufen, Locations in Listen angezeigt, Kontaktangaben angeklickt und Locations gemerkt werden. Gespeichert werden Zeitpunkt, Seite, die Domain der Herkunftsseite und die Browserkennung. Deine IP-Adresse speichern wir nicht: Aus IP-Adresse und Browserkennung bilden wir mit einem täglich neuen Schlüssel, den wir nach einem Tag löschen, eine Kennzahl, mit der wir Besuche pro Tag zählen. Danach lässt sie sich keiner Person mehr zuordnen. Wir zeigen Locations, wie oft ihr Eintrag gesehen wurde, und nennen Werbekunden zusammengefasste Zahlen. Findet eine Suche keine Location, zählen wir Suchtext und Filter pro Woche, ohne Angaben zu dir, damit wir sehen, welche Locations fehlen. Vom Suchtext speichern wir höchstens 100 Zeichen. Enthält er ein @ oder eine Folge von sechs oder mehr Ziffern, etwa eine Telefonnummer, zählen wir die Suche nicht. Diese Zählung löschen wir nach höchstens 12 Monaten. Sendet dein Browser das Signal Global Privacy Control, zählen wir nichts.'
        abuse:
            title: Schutz vor Missbrauch
            # TODO owner: #20 must schedule cache:pool:prune, or expired counters stay on the server (T10).
            text: 'Damit Formular und Telefonnummern nicht automatisiert abgegriffen werden, zählen wir Anfragen pro IP-Adresse. Dafür legen wir zu deiner IP-Adresse einen Zähler im Zwischenspeicher des Servers ab. Er läuft spätestens zwei Stunden nach deiner letzten Anfrage ab, abgelaufene Zähler löschen wir regelmässig. Mit deiner Anfrage speichern wir die IP-Adresse nicht.'
        # D26: one line per entry of the site.processors parameter, keyed by its key; LegalPagesTest checks that every key has one.
        processors:
            title: Dienstleister, die Daten für uns bearbeiten
            intro: 'Diese Anbieter bearbeiten Personendaten in unserem Auftrag. Was sie genau erhalten, steht in den Abschnitten darunter.'
            infomaniak: Hosting der Website und Versand der E-Mails
            neon: Datenbank mit Anfragen und Kontakten
            sentry: Meldungen technischer Fehler
            # D48: names the rating and the photos only while their switch is on (`shows`, datenschutz.html.twig).
            google: '{shows, select, both {Karten, Bewertungen und Fotos von Google Maps} rating {Karten und Bewertungen von Google Maps} photos {Karten und Fotos von Google Maps} other {Karten von Google Maps}}, Videos von YouTube'
            vimeo: Videos von Vimeo
        hosting:
            title: Hosting und Datenbank
            # TODO owner: confirm the contracting Infomaniak entity and the 14-day log rotation of deploy/nginx (F15, T2).
            web: Die Website läuft auf einem Server der Infomaniak Network SA, Rue Eugène-Marziano 25, 1227 Les Acacias (Genf). Die Daten liegen in der Schweiz. Beim Aufruf entstehen technisch nötige Server-Protokolle mit IP-Adresse, Zeitpunkt, Browser-Angaben und der zuvor besuchten Seite. Wir löschen sie nach 14 Tagen.
            # TODO owner: check Neon's data processing terms (T1); the region is aws-eu-central-1, Frankfurt (F15).
            database: Die Datenbank mit den Anfragen betreibt Neon in einem Rechenzentrum in Frankfurt, Deutschland. Anbieterin ist die Databricks, Inc. (USA), die Muttergesellschaft der Neon, LLC. Für die Übermittlung in die USA gelten das Swiss-US Data Privacy Framework und Standardvertragsklauseln.
            # TODO owner: confirm the mailbox hallo@deine-eventlocation.ch at Infomaniak (F15, T3).
            mail: E-Mails verschicken wir über den Mailserver der Infomaniak Network SA in der Schweiz.
            # TODO owner: delete this key and its template line if Sentry does not ship, and confirm a test event holds no IP address, cookies or form contents (T4).
            errors: Technische Fehler melden wir an Sentry, einen Dienst der Functional Software, Inc. (USA). Die Fehlerberichte liegen in der EU (Frankfurt) und enthalten die aufgerufene Seite, aber weder IP-Adresse noch Cookies noch Formularinhalte. Die Kontodaten unseres Sentry-Zugangs liegen in den USA.
        maps:
            # D48: as processors.google.
            title: '{shows, select, both {Karten, Bewertungen und Fotos von Google Maps} rating {Karten und Bewertungen von Google Maps} photos {Karten und Fotos von Google Maps} other {Karten von Google Maps}}'
            # TODO owner: check Google's controller and address against policies.google.com/privacy before go-live (T8, #15).
            text: Auf der Seite einer Location kann eine Karte von Google Maps erscheinen, ein Dienst der Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Die Karte laden wir erst, wenn du auf «Karte laden» klickst; für die Karte wird vorher nichts an Google übertragen. Mit dem Klick ruft dein Browser die Karte direkt bei Google ab; dabei erhält Google deine IP-Adresse und die Adresse unserer Website, und Google kann Cookies setzen.
            # #52: the near-me page loads Google Maps on view (owner Q6); quotes the nav link and the button, pinned by LegalPagesTest.
            nearby: 'Die Seite «In der Nähe» lädt die Karte von Google Maps sofort beim Aufruf. Dabei erhält Google deine IP-Adresse, die Adresse unserer Website und den angezeigten Kartenausschnitt, und Google kann Cookies setzen. Wenn du «Meinen Standort verwenden» wählst, fragt dein Browser nach deinem Standort. Wir erhalten ihn nur auf etwa 1 km gerundet als Teil der aufgerufenen Adresse; wir speichern ihn nicht in unserer Datenbank, und wie jede aufgerufene Adresse erscheint er in den Server-Protokollen des Hostings.'
            # #53: the detail page's Google rating loads on view; pinned by LegalPagesTest. D48: only while GOOGLE_RATING_ENABLED.
            rating: 'Auf der Seite einer Location kann die Google-Bewertung erscheinen: Sterne und Anzahl Bewertungen von Google Maps. Dein Browser lädt sie ohne Klick direkt bei Google, sobald dieser Teil der Seite sichtbar wird. Dabei erhält Google deine IP-Adresse und die Adresse unserer Website, und Google kann Cookies setzen. Wir speichern keine Bewertungen von Google.'
            # D12, places-photos: our server fetches the photos, the visitor's browser never contacts Google; pinned by LegalPagesTest. D48: only with GOOGLE_PLACES_PHOTOS_KEY.
            photos: 'Hat eine Location noch keine eigenen Fotos, kann ihre Seite Fotos von Google Maps zeigen, jedes mit dem Namen der Person, die es hochgeladen hat. Diese Fotos ruft unser Server bei Google ab und reicht sie direkt an deinen Browser weiter; dein Browser verbindet sich dafür nicht mit Google. Google erhält die Anfragen von unserem Server, nicht von deinem Browser, und damit weder deine IP-Adresse noch die Adresse der Seite, die du ansiehst; Google erfährt nur, zu welcher Location wir Fotos abrufen. Wir speichern die Fotos nicht. Erst wenn du bei einem Foto auf «Google Maps» oder auf den Namen klickst, öffnet sich Google Maps; ab dann gelten die Datenschutzbestimmungen von Google.'
            policy: 'Es gelten die Datenschutzbestimmungen von Google:'
            policy_link: policies.google.com/privacy
        # G15: the detail page's video facade; quotes the button and link labels (detail.videos.*), pinned by LegalPagesTest.
        videos:
            title: Videos von YouTube und Vimeo
            # TODO owner: check both controllers and addresses against policies.google.com/privacy and vimeo.com/privacy before go-live (G15).
            text: 'Auf der Seite einer Location können Videos erscheinen, die bei YouTube oder Vimeo liegen. YouTube ist ein Dienst der Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland; Vimeo ist ein Dienst der Vimeo.com, Inc., 330 West 34th Street, 5th Floor, New York, NY 10001, USA. Ein Video laden wir erst, wenn du auf «Video laden» klickst; vorher wird für das Video nichts an YouTube oder Vimeo übertragen, auch kein Vorschaubild. Mit dem Klick ruft dein Browser das Video direkt beim Anbieter ab; dabei erhält der Anbieter deine IP-Adresse und die Adresse unserer Website, und er kann Cookies oder ähnliche Techniken einsetzen. Beide Anbieter können diese Daten auch in den USA bearbeiten.'
            modes: 'Videos von YouTube binden wir im erweiterten Datenschutzmodus über youtube-nocookie.com ein, Videos von Vimeo mit der Einstellung «Do Not Track». Wir speichern von einem Video nur, bei welchem Anbieter es liegt und welche Nummer es dort hat.'
            policy: 'Es gelten die Datenschutzbestimmungen der Anbieter:'
            policy_youtube: policies.google.com/privacy
            policy_vimeo: vimeo.com/privacy
        links:
            title: Links zu anderen Anbietern
            text: 'Die Seiten der Locations verlinken auf deren Websites und Instagram-Profile, das Teilen über WhatsApp führt zu WhatsApp. Der Link «Auf Google Maps öffnen» auf der Seite einer Location führt zu Google Maps, die Links «Auf YouTube ansehen» und «Auf Vimeo ansehen» führen zu YouTube und Vimeo. Diese Dienste werden erst geladen, wenn du den Link anklickst; ab dann gelten ihre Datenschutzbestimmungen.'
        staff:
            title: Interner Bereich
            text: Unser interner Bereich ist nur für unsere Mitarbeitenden. Nur dort und im Konto für Locations gibt es eine Anmeldung und ein Sitzungs-Cookie.
        rights:
            title: Deine Rechte
            text: Du kannst Auskunft über deine Daten verlangen und sie berichtigen oder löschen lassen. Schreib uns dafür an die oben genannte E-Mail-Adresse. Du kannst dich auch an den Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) wenden.
# #26: labels of the Shared module's text blocks in the back office's text-block list.
blocks:
    footer_note:
        label: Hinweis in der Fusszeile
        placement: Fusszeile jeder öffentlichen Seite, unter den Links
