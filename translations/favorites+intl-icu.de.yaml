# Strings of the Favorites module. Keys: <context>.<description>.
merken:
    # The visible text of the Merken button on a card.
    label: Merken
    # The detail page's button (#8).
    label_detail: Location merken
    # The accessible name, so the 48 buttons of a listing are distinguishable.
    label_for: '{name} merken'

# The remove button on /merkliste. label_for is the accessible name and contains the visible word.
remove:
    label: Entfernen
    label_for: '{name} entfernen'

merkliste:
    title: Deine Merkliste
    meta_description: Alle Hochzeitslocations, die du dir gemerkt hast, auf einen Blick.
    # formatted = count|swiss_number
    count: '{count, plural, one {# Location} other {{formatted} Locations}}'
    results_label: Gemerkte Locations
    empty:
        title: Deine Merkliste ist noch leer.
        cta: Locations entdecken
    full: 'Deine Merkliste ist voll: Es passen {max} Locations hinein. Entferne eine, um eine neue zu merken.'

# Toasts built by merkliste.js. The name reaches them as the placeholder __name__.
toast:
    added: '{name} wurde deiner Merkliste hinzugefügt.'
    removed: '{name} wurde von deiner Merkliste entfernt.'
    full: Deine Merkliste ist voll.
    link: Zur Merkliste
