# Strings of the Seo module. Keys: <context>.<description>.
# {site} is supplied by Seo\TitleChain and ListingMeta; titles stay ≤ 60 characters, descriptions ≤ 155.
listing:
    title: 'Eventlokale in der Schweiz | {site}'
    title_page: 'Eventlokale Schweiz – Seite {page} | {site}'
    title_page_bare: 'Eventlokale Schweiz – Seite {page}'
    description: 'Eventlokale in der ganzen Schweiz vergleichen: Fotos, Platz für Gäste und Lage für Firmenanlass, Seminar, Apéro und Feier.'
    description_page: 'Eventlokale in der Schweiz, Seite {page}: Fotos, Platz für Gäste und Lage aller Locations auf einen Blick.'
home:
    title: 'Eventlokale in der Schweiz finden | {site}'
    title_short: 'Eventlokale Schweiz finden | {site}'
    description: 'Finde das passende Eventlokal in der Schweiz: nach Region, Anlass und Gästezahl suchen und direkt bei der Location anfragen.'
# Landing pages (#17, F8), first fit wins (TitleChain), the h1 cut as the last resort:
# canton, town, event and event_canton title_count, title, title_short, title_name, numbered title_page,
# title_page_short, title_page_bare; building title_count, title, numbered title_page, title_page_bare.
# A bare title drops {site}, so a numbered page keeps its number. {heading} is the building page's h1,
# {event} the event type's plural name (search catalogue). event_canton is an event page in a canton.
landing:
    canton:
        title_count: '{count, plural, one {# Eventlokal} other {# Eventlokale}} {canton_code, select, li {in} other {im Kanton}} {canton} | {site}'
        title: 'Eventlokale {canton_code, select, li {in} other {im Kanton}} {canton} | {site}'
        title_short: 'Eventlokale {canton_code, select, li {} other {Kanton }}{canton} | {site}'
        title_name: 'Eventlokale {canton} | {site}'
        title_page: 'Eventlokale {canton_code, select, li {in} other {im Kanton}} {canton} – Seite {page} | {site}'
        title_page_short: 'Eventlokale {canton} – Seite {page} | {site}'
        title_page_bare: 'Eventlokale {canton} – Seite {page}'
        description: 'Eventlokale {canton_code, select, li {in} other {im Kanton}} {canton}: {count, plural, one {# Location} other {# Locations}} mit Fotos, Platz für Gäste und Lage im Vergleich.'
    town:
        title_count: '{count, plural, one {# Eventlokal} other {# Eventlokale}} in {town} | {site}'
        title: 'Eventlokale in {town} | {site}'
        title_short: 'Eventlokale {town} | {site}'
        title_name: 'Events {town} | {site}'
        title_page: 'Eventlokale in {town} – Seite {page} | {site}'
        title_page_short: 'Eventlokale {town} – Seite {page} | {site}'
        title_page_bare: 'Events {town} – Seite {page}'
        description: 'Eventlokale in {town}: {count, plural, one {# Location} other {# Locations}} mit Fotos, Platz für Gäste und Lage im Vergleich.'
    building:
        title_count: '{heading}: {count, plural, one {# Location} other {# Locations}} | {site}'
        title: '{heading} | {site}'
        title_page: '{heading} – Seite {page} | {site}'
        title_page_bare: '{heading} – Seite {page}'
        description: '{heading}: {count, plural, one {# Location} other {# Locations}} in der Schweiz mit Fotos, Platz für Gäste und Lage im Vergleich.'
    event:
        title_count: '{count, plural, one {# Eventlokal} other {# Eventlokale}} für {event} | {site}'
        title: 'Eventlokale für {event} | {site}'
        title_short: '{event}: Eventlokale | {site}'
        title_name: '{event} | {site}'
        title_page: 'Eventlokale für {event} – Seite {page} | {site}'
        title_page_short: '{event} – Seite {page} | {site}'
        title_page_bare: '{event} – Seite {page}'
        description: 'Eventlokale für {event} in der ganzen Schweiz: {count, plural, one {# Location} other {# Locations}} mit Fotos, Platz für Gäste und Lage im Vergleich.'
    event_canton:
        title_count: '{count, plural, one {# Eventlokal} other {# Eventlokale}} für {event} {canton_code, select, li {in} other {im Kanton}} {canton} | {site}'
        title: 'Eventlokale für {event} {canton_code, select, li {in} other {im Kanton}} {canton} | {site}'
        title_short: '{event} {canton_code, select, li {in} other {im Kanton}} {canton} | {site}'
        title_name: '{event} {canton} | {site}'
        title_page: 'Eventlokale für {event} {canton_code, select, li {in} other {im Kanton}} {canton} – Seite {page} | {site}'
        title_page_short: '{event} {canton} – Seite {page} | {site}'
        title_page_bare: '{event} {canton} – Seite {page}'
        description: 'Eventlokale für {event} {canton_code, select, li {in} other {im Kanton}} {canton}: {count, plural, one {# Location} other {# Locations}} mit Fotos, Platz für Gäste und Lage im Vergleich.'
# /llms.txt and the venues' Markdown views (seo-llms-txt). Numbers arrive pre-formatted ({formatted}, {count} in capacity).
llms:
    summary: 'Eventlokale in der ganzen Schweiz für Firmenanlässe, Seminare, Apéros, Weihnachtsfeiern und private Feiern, mit Platz für Gäste, Lage und Ausstattung.'
    about: 'Alle Inhalte sind auf Deutsch. Zu jeder Location gibt es neben ihrer Seite eine Markdown-Fassung; die Links unter «Locations» führen dorthin. Anfragen gehen über das Formular auf der Seite der Location.'
    filters: 'Die Übersicht lässt sich über Parameter filtern, zum Beispiel nach der Zahl der Gäste:'
    section:
        search: Suche
        cantons: Kantone
        towns: Orte
        buildings: Location-Arten
        events: Anlässe
        venues: Locations
        optional: Optional
    home: Startseite
    home_note: 'Suche nach Region, Anlass und Gästezahl'
    listing: Alle Eventlokale
    listing_note: 'Übersicht aller Locations mit Filtern nach Kanton, Ort, Umkreis, Gästezahl, Lage, Ausstattung und Preis'
    landing_note: '{count, plural, one {1 Location} other {{formatted} Locations}}'
    capacity: 'bis {count} Personen'
    sitemap: Sitemap
    sitemap_note: Alle Seiten als XML-Sitemap
    inquiry: Anfrage über das Formular
    source: 'Seite der Location:'
# First fit wins (TitleChain): title_town_long, title_town, title_name.
venue:
    title_town_long: '{name} in {town} mieten | {site}'
    title_town: '{name} in {town} | {site}'
    title_canton: '{name} {canton_code, select, li {in} other {im Kanton}} {canton} | {site}'
    title_name: '{name} | {site}'
    canton_area: '{canton_code, select, li {} other {Kanton }}{canton}'
breadcrumb:
    listing: Eventlokale
    canton: '{canton_code, select, li {} other {Kanton }}{canton}'
footer:
    cantons_title: Eventlokale nach Kanton
error:
    not_found:
        title: Seite nicht gefunden
        heading: Diese Seite gibt es nicht
        text: Der Link stimmt nicht mehr oder die Seite ist umgezogen. In der Übersicht findest du alle Eventlokale.
    gone:
        title: Location nicht mehr verfügbar
        heading: Diese Location ist nicht mehr dabei
        text: Die Location ist bei uns nicht mehr aufgeführt. In der Übersicht findest du alle anderen Eventlokale.
    server:
        title: Fehler
        heading: Da ist etwas schiefgelaufen
        text: Die Seite lässt sich gerade nicht anzeigen. Bitte versuch es in ein paar Minuten noch einmal.
    to_listing: Alle Eventlokale
