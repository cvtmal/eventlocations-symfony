# Strings of the Seo module. Keys: <context>.<description>.
# {site} is supplied by Seo\TitleChain and ListingMeta; titles stay ≤ 60 characters, descriptions ≤ 155.
listing:
    title: 'Hochzeitslocations in der Schweiz | {site}'
    title_page: 'Hochzeitslocations Schweiz – Seite {page} | {site}'
    description: 'Hochzeitslocations in der ganzen Schweiz vergleichen: Fotos, Platz für Gäste, Bewertungen und Lage aller Locations auf einen Blick.'
    description_page: 'Hochzeitslocations in der Schweiz, Seite {page}: Fotos, Platz für Gäste, Bewertungen und Lage aller Locations auf einen Blick.'
# Landing pages (#17), first fit wins (TitleChain), the h1 cut as the last resort:
# canton and town title_count, title, title_short, title_name, numbered title_page, title_page_short, title_page_bare;
# building title_count, title, numbered title_page, title_page_bare. A bare title drops {site}, so a numbered page keeps its number. {heading} is the building page's h1 (search catalogue).
landing:
    canton:
        title_count: '{count, plural, one {# Hochzeitslocation} other {# Hochzeitslocations}} im Kanton {canton} | {site}'
        title: 'Hochzeitslocations im Kanton {canton} | {site}'
        title_short: 'Hochzeitslocations Kanton {canton} | {site}'
        title_name: 'Hochzeitslocations {canton} | {site}'
        title_page: 'Hochzeitslocations im Kanton {canton} – Seite {page} | {site}'
        title_page_short: 'Hochzeitslocations {canton} – Seite {page} | {site}'
        title_page_bare: 'Hochzeitslocations {canton} – Seite {page}'
        description: 'Hochzeitslocations im Kanton {canton}: {count, plural, one {# Location} other {# Locations}} mit Fotos, Platz für Gäste, Bewertungen und Lage im Vergleich.'
    town:
        title_count: '{count, plural, one {# Hochzeitslocation} other {# Hochzeitslocations}} in {town} | {site}'
        title: 'Hochzeitslocations in {town} | {site}'
        title_short: 'Hochzeitslocations {town} | {site}'
        title_name: 'Hochzeit {town} | {site}'
        title_page: 'Hochzeitslocations in {town} – Seite {page} | {site}'
        title_page_short: 'Hochzeitslocations {town} – Seite {page} | {site}'
        title_page_bare: 'Hochzeit {town} – Seite {page}'
        description: 'Hochzeitslocations in {town}: {count, plural, one {# Location} other {# Locations}} mit Fotos, Platz für Gäste, Bewertungen und Lage im Vergleich.'
    building:
        title_count: '{heading}: {count, plural, one {# Location} other {# Locations}} | {site}'
        title: '{heading} | {site}'
        title_page: '{heading} – Seite {page} | {site}'
        title_page_bare: '{heading} – Seite {page}'
        description: '{heading}: {count, plural, one {# Location} other {# Locations}} in der Schweiz mit Fotos, Platz für Gäste, Bewertungen und Lage im Vergleich.'
# First fit wins (TitleChain): title_town_long, title_town, title_name.
venue:
    title_town_long: '{name} in {town} mieten | {site}'
    title_town: '{name} in {town} | {site}'
    title_canton: '{name} im Kanton {canton} | {site}'
    title_name: '{name} | {site}'
    canton_area: 'Kanton {canton}'
breadcrumb:
    listing: Hochzeitslocations
    canton: 'Kanton {canton}'
footer:
    cantons_title: Hochzeitslocations nach Kanton
error:
    not_found:
        title: Seite nicht gefunden
        heading: Diese Seite gibt es nicht
        text: Der Link stimmt nicht mehr oder die Seite ist umgezogen. In der Übersicht findest du alle Hochzeitslocations.
    gone:
        title: Location nicht mehr verfügbar
        heading: Diese Location ist nicht mehr dabei
        text: Sie ist bei uns nicht mehr aufgeführt. In der Übersicht findest du alle anderen Hochzeitslocations.
    server:
        title: Fehler
        heading: Da ist etwas schiefgelaufen
        text: Die Seite lässt sich gerade nicht anzeigen. Bitte versuche es in ein paar Minuten noch einmal.
    to_listing: Alle Hochzeitslocations
