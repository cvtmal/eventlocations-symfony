# Constraint messages of the application's forms (the validator translates them in this domain).
# Keys: <form>.<field>.<rule>.
inquiry:
    occasion:
        required: Bitte wähle einen Anlass.
    guests:
        required: Bitte gib die Anzahl Gäste an.
        invalid: Bitte gib die Anzahl Gäste als ganze Zahl an.
        range: Bitte gib zwischen 1 und 5000 Gäste an.
    event_date:
        invalid: Bitte gib ein gültiges Datum an.
    message:
        required: Bitte schreib eine Nachricht.
        too_long: Die Nachricht darf höchstens 5000 Zeichen lang sein.
        invalid: Die Nachricht enthält ungültige Zeichen.
    first_name:
        required: Bitte gib deinen Vornamen an.
        too_long: Der Vorname darf höchstens 100 Zeichen lang sein.
        invalid: Der Vorname enthält ungültige Zeichen.
    last_name:
        required: Bitte gib deinen Namen an.
        too_long: Der Name darf höchstens 100 Zeichen lang sein.
        invalid: Der Name enthält ungültige Zeichen.
    email:
        required: Bitte gib deine E-Mail-Adresse an.
        invalid: Bitte gib eine gültige E-Mail-Adresse an.
        too_long: Die E-Mail-Adresse darf höchstens 254 Zeichen lang sein.
    phone:
        invalid: Bitte gib eine gültige Telefonnummer an.
