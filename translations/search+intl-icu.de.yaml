        heading: 'Nach Anlass suchen'
        all: 'Alle Locations'
    steps:
        heading: 'In vier Schritten zur Traumlocation'
        filter:
            number: '01'
            title: Filtern
            text: 'Nach Region, Location-Art und Gästezahl eingrenzen.'
        compare:
            number: '02'
            title: Vergleichen
            text: 'Fotos, Kapazitäten und Angebote ansehen und auf die Merkliste setzen.'
        inquire:
            number: '03'
            title: Anfragen
            text: 'Direkt bei der Location anfragen, ohne Umweg.'
        celebrate:
            number: '04'
            title: Feiern
            text: 'Den grossen Tag geniessen.'
    spotlight:
        heading: 'Locations im Spotlight'
    cta:
        heading: 'Plane deine Hochzeit'
        text: 'Starte noch heute mit der Suche nach deiner Hochzeitslocation in der Schweiz und stell deine Anfragen direkt bei der Location.'
        button: 'Jetzt starten'
    about:
        heading: 'Die passende Hochzeitslocation für deinen Tag'
        lead: 'Jede Hochzeit ist einzigartig, genau wie ihr Ort. In der Schweiz gibt es zahlreiche aussergewöhnliche Locations für eine stilvolle Feier: eine romantische Hochzeit im Märchenschloss, eine freie Trauung auf der Alp mit Feier in der Berghütte oder ein Bankett in einem exklusiven Hotel.'
        filters: 'Mit unseren Filtern grenzt du die Auswahl nach Region, Kategorie, Preisniveau und Gästezahl ein.'
        kinds:
            hotels:
                term: Hotels
                text: 'Luxushotels und komfortable Gasthäuser.'
            restaurants:
                term: Restaurants
                text: 'Vom Bergrestaurant mit Alpenpanorama bis zum Lokal an der Seepromenade.'
            castles:
                term: 'Burgen & Schlösser'
                text: 'Historischer Charme in denkmalgeschützten Mauern.'
            halls:
                term: Säle
                text: 'Für grössere Gesellschaften, unabhängig von Jahreszeit und Wetter.'
            event_halls:
                term: Eventhallen
                text: 'Nachtlokale, Messehallen und stillgelegte Industriehallen.'
            estates:
                term: 'Gutshöfe & Weingüter'
                text: 'Feiern zwischen den Reben, im Einklang mit der Natur.'
            originals:
                term: 'Originelle Locations'
                text: 'Scheunen, Lofts, Wintergärten, Berghütten und Chalets.'
    regions:
        heading: 'Hochzeitslocations nach Region'
