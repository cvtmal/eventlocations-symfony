# Strings of the Search module. Keys: <context>.<description>.
listing:
    heading: Hochzeitslocations in der Schweiz
    # formatted = count|swiss_number
    count: '{count, plural, one {# Resultat} other {{formatted} Resultate}}'
    results_label: Suchresultate
    empty:
        title: Keine Location passt zu deinen Filtern
        reset: Filter löschen
filter:
    bar_label: Filter
    region: Region
    guests: Anzahl Gäste
    guests_title: Wieviele Gäste erwartest du?
    guests_picks: Gästezahl wählen
    more: weitere Filter +
    more_title: Wähle weitere Filter & Möglichkeiten
    more_active: 'weitere Filter ({count})'
    more_remove: Weitere Filter entfernen
    more_name_title: Suche eine konkrete Location
    more_name_placeholder: Name eingeben
    more_access: Erreichbarkeit
    more_price: Preisniveau
    more_wedding: Feier und Ausstattung
    more_buildings_all: Alle Gebäudearten
    more_buildings_close: Gebäudearten schliessen
    more_rooms_title: Raumangebot
    more_rooms: Anzahl Räume
    more_area: Grösster Raum
    more_height: Min. Raumhöhe
    more_rooms_option: '{rooms, plural, one {# Raum} other {# Räume}}'
    more_rooms_max: '≥ {rooms} Räume'
    # area and height are swiss_number output
    more_area_option: '{area} m²'
    more_area_max: '≥ {area} m²'
    more_height_option: '{height} m'
    more_height_max: '≥ {height} m'
    reset: Filter löschen
    merkliste: Merkliste
    region_title: Wo soll eure Hochzeit stattfinden?
    region_tab_canton: Kanton
    region_tab_place: Ort/PLZ
    canton_placeholder: Kanton eingeben
    canton_all: Alle Kantone
    place_placeholder: Ort oder PLZ eingeben
    radius_label: Umkreis
    # formatted = the radius, or %n for JS
    radius_value: '{radius, plural, =0 {0 km} other {+{formatted} km}}'
    no_places: Kein Ort gefunden
    # formatted = count|swiss_number, or %n for live-count.js
    show_results: '{count, plural, =0 {Keine Resultate} one {# Resultat anzeigen} other {{formatted} Resultate anzeigen}}'
    show_results_plain: Resultate anzeigen
    map_label: Karte der Schweizer Kantone
    map_credit: 'Quelle: Bundesamt für Statistik (BFS), GEOSTAT'
chip:
    remove: 'Filter {label} entfernen'
    place_generic: Ort
    place: '{place}'
    place_radius: '{place} + {radius} km'
    # guests = count|swiss_number; count = the number, for the plural only.
    guests: '{count, plural, one {{guests} Gast} other {{guests} Gäste}}'
card:
    # Visually hidden before the price tag, so "Mittel" is not read alone.
    price_level: 'Preisniveau:'
    photos_label: 'Bilder von {name}'
    rating: '{label} ({score}) | {count}'
    rating_unlabelled: '({score}) | {count}'
    # The accessible name of the thumbs-up icon after the count.
    rating_count: Bewertungen
    highlight: '“{highlight}”'
pagination:
    label: Seiten
    range: '{from} - {to} von {total} Resultaten'
    previous: Vorherige Seite
    next: Nächste Seite
    page: 'Seite {page}'
related:
    title: Andere suchten auch nach
    canton: 'Hochzeit {canton}'
# "Ähnliche Locations" on the detail page (#8, SimilarVenuesController fragment).
similar:
    heading: Ähnliche Locations
    all: Alle Locations
    label: Ähnliche Locations
