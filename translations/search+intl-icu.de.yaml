    guests_placeholder: 'z.B. 80'
    # formatted = count|swiss_number
    guests_chip: '{count, plural, one {1 Gast} other {{formatted} Gäste}}'
    more: weitere Filter +
    more_title: Wähle weitere Filter und Möglichkeiten
    more_active: 'weitere Filter ({count})'
