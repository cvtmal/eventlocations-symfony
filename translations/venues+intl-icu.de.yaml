# Strings of the Venues module. Keys: <context>.<description>.
# Vocabulary keys are <context>.<case value> (App\Venues\ValueObject\*) and
# term.<group>.<code> (rows of taxonomy_terms, in position order). The ten groups and their
# terms are the vocabulary of event-vocabulary (F3): seven filter groups, then the event facts
# amenity, catering and language of the detail page's "Angaben zur Location".
# The labels of setting, building, infrastructure and surroundings are our own wording (F7b): FI-4 had copied them 1:1
# from eventlokale, which D11 rules out. A label is free text; the code is the key and never changes.

