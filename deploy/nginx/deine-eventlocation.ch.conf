# nginx on the VPS (F15): /etc/nginx/sites-available/deine-eventlocation.ch, linked from sites-enabled.
# Production's whole web front: redirects, TLS, compression, static files and their cache headers.
# Security headers come from the app (SecurityHeadersListener), so nothing here duplicates them.
# tests/Deploy/nginx-check.sh runs this file in a real nginx against a real php-fpm.
#
# One certificate covers all four names (docs/operations.md, certbot --webroot):
#   deine-eventlocation.ch, www.deine-eventlocation.ch, deineeventlocation.ch, www.deineeventlocation.ch

# G5, G9, G11: the token of a preview link (/vorschau/<token>), its short code (/v/<code>) and the token of a
# cancellation link (/konto/abo-kuendigen/<token>) are secrets and never logged (Wave G §4a.4). These
# requests, and requests whose Referer is such a page, skip the access log; every server below logs
# through `if=$deine_eventlocation_loggable` (the default path and format, written out).
map $request_uri $deine_eventlocation_loggable_uri {
    ~*^/vorschau/ 0;
    ~*^/konto/abo-kuendigen/ 0;
    ~*^/v/ 0;
    # D12, places-photos: the path names a Google photo, which may not be kept.
    ~*^/eventlokal/[^/]+/google-fotos/ 0;
    default 1;
}
# D12, places-photos: a Google photo request holds a php-fpm worker while it waits for Google (at most 5 s), so at
# most 4 of them run at once, site-wide; the rest get 503, which the page answers with its placeholder.
limit_conn_zone $server_name zone=google_photos:1m;
map $http_referer $deine_eventlocation_loggable {
    ~*^https?://[^/]+/vorschau/ 0;
    ~*^https?://[^/]+/konto/abo-kuendigen/ 0;
    ~*^https?://[^/]+/v/ 0;
    default $deine_eventlocation_loggable_uri;
}

# Anything that is not one of our names gets no answer at all; Symfony's trusted_hosts would refuse it
# anyway, but this keeps scanners off php-fpm.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Plain HTTP: certbot's renewals, then straight to the canonical https host in one hop, whichever
# of the four names was asked for.
server {
    listen 80;
    listen [::]:80;
    server_name deine-eventlocation.ch www.deine-eventlocation.ch deineeventlocation.ch www.deineeventlocation.ch;
    access_log /var/log/nginx/access.log combined if=$deine_eventlocation_loggable;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://deine-eventlocation.ch$request_uri;
    }
}

# The other three names over https (E7: deineeventlocation.ch redirects to the canonical domain).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deine-eventlocation.ch deineeventlocation.ch www.deineeventlocation.ch;
    access_log /var/log/nginx/access.log combined if=$deine_eventlocation_loggable;

    ssl_certificate /etc/letsencrypt/live/deine-eventlocation.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deine-eventlocation.ch/privkey.pem;

    return 301 https://deine-eventlocation.ch$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deine-eventlocation.ch;
    access_log /var/log/nginx/access.log combined if=$deine_eventlocation_loggable;

    ssl_certificate /etc/letsencrypt/live/deine-eventlocation.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deine-eventlocation.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # current is a symlink that bin/deploy switches; $realpath_root below resolves it per request.
    root /var/www/deine-eventlocation.ch/current/public;
    server_tokens off;

    # One CMS upload per request (S12, #25), just above PHP's post_max_size (26M in public/.user.ini),
    # so a larger body is nginx's own 413; nginx's 1 MB default would refuse every photo.
    client_max_body_size 26m;

    # PHP's responses and the text assets; images and fonts are compressed already. text/html is always on.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # No dotfile is for visitors (public/.user.ini sets PHP's limits).
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/eventlokal/[^/]+/google-fotos(/|$) {
        limit_conn google_photos 4;
        limit_conn_status 503;
        try_files $uri /index.php$is_args$args;
    }

    # AssetMapper's file names carry a content hash, so a changed file is a new URL.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite's file names carry a content hash too.
    location /admin-build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never immutable: app:media:regenerate rewrites these files under the same URLs.
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/deine-eventlocation.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # The resolved path, not .../current/...: OPcache keys on it, so a switched symlink means new
        # code on the next request and never a mix, and a running request keeps its own release.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # expose_php cannot be set from .user.ini.
        fastcgi_hide_header X-Powered-By;
        # Uploads go to PHP as they come; HttpCache answers are bounded by the app.
        fastcgi_read_timeout 130s;
        # php-fpm down, overloaded or too slow (F16 N8): the static German page instead of nginx's own,
        # with the status kept. Only nginx's errors: without fastcgi_intercept_errors the app's own 5xx
        # pages pass through, and the limiter's 503 of google-fotos stays a bare 503 for an <img>.
        error_page 502 503 504 /50x.html;
        internal;
    }

    location = /50x.html {
        internal;
        # A release without the page (before the first deploy, a rollback past F16) stays a 502, never a 404.
        try_files $uri =502;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Only the front controller is executable.
    location ~ \.php$ {
        return 404;
    }
}
