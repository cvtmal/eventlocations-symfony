; php-fpm pool on the VPS (F15): /etc/php/8.5/fpm/pool.d/deine-eventlocation.conf, then
; `systemctl reload php8.5-fpm`. The per-request limits live in public/.user.ini, which ships with
; each release; this file holds only what a .user.ini cannot set.
[deine-eventlocation]
user = deploy
group = deploy
listen = /run/php/deine-eventlocation.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; A small VPS: each worker can hold 256M (memory_limit) while it encodes an upload.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; OPcache keeps PHP's defaults: nginx passes the resolved release path (SCRIPT_FILENAME uses
; $realpath_root), so a symlink switch needs no reload. Its memory settings would belong in
; /etc/php/8.5/fpm/conf.d/, not here (a pool is read after the shared memory exists).
; X-Powered-By is dropped by nginx (fastcgi_hide_header), because expose_php is PHP_INI_SYSTEM.
