# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Originals (S9): MEDIA_ROOT; generated variants and published PDFs: public/media/<venue-number>/.
    app.media_root: '%env(resolve:MEDIA_ROOT)%'
    app.media_public_dir: '%kernel.project_dir%/public/media'
    # Venue content folders (S8, #9) and the import's variant staging directory.
    app.content_root: '%env(resolve:CONTENT_ROOT)%'
    app.import_staging_dir: '%kernel.project_dir%/var/import-staging'
    # Public contact address of the site (Q5); the guest copy's Reply-To (#14).
    site.contact_email: 'hallo@hochzeitslocation.ch'
    # Site and operator (Q5): JSON-LD, title suffix; #18's legal pages reuse them.
    site.name: 'Hochzeitslocation'
    site.operator_name: 'Pick n Roll GmbH'
    site.operator_street: 'Sonneggstrasse 61'
    site.operator_postcode: '8006'
    site.operator_city: 'Zürich'
    # Q5: the Impressum's UID line (#18).
    site.operator_uid: 'CHE-134.034.546 MWST'
    # LEG-2: app:inquiries:purge deletes inquiries older than this (#18 documents it).
    inquiries.retention_months: 12
    # #17: a canton, town or building landing page exists from this many published venues, below it 404 (one rule, #26 reads it).
    landing.min_venues: 5

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Shared\Messenger\CommandHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: command.bus }]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Entity/'

    # S10: no HTTP cache yet; #19 points this alias at its proxy's purge (#9 P24).
    App\Venues\HttpCachePurger: '@App\Venues\NullHttpCachePurger'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    parameters:
        # DemoStory's 60 venues give a handful of canton pages at 3 (S11 checks on the dev site).
        landing.min_venues: 3

when@test:
    parameters:
        # Tests never touch the dev demo files.
        app.media_public_dir: '%kernel.project_dir%/var/test-media/public'

    services:
        # Tests assert the Venues handlers' purges (S10, #9 P24) through the real container.
        App\Tests\Support\Http\RecordingHttpCachePurger:
            public: true
        App\Venues\HttpCachePurger: '@App\Tests\Support\Http\RecordingHttpCachePurger'
        # The transport of every HTTP client in tests (framework.yaml, when@test, #32 PD10).
        App\Tests\Support\Http\WixImageResponses:
            public: true
        # WixPhotoCacheTest takes the real service, wired to wix.client and its retries.
        App\Venues\WixPhotoCache:
            autowire: true
            public: true
