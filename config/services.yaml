# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Originals (S9): MEDIA_ROOT; generated variants and published PDFs: public/media/<venue-number>/.
    app.media_root: '%env(resolve:MEDIA_ROOT)%'
    app.media_public_dir: '%env(resolve:MEDIA_PUBLIC_DIR)%'
    # Limits of a CMS photo upload (#25): the pixel cap (Assert\Image maxPixels) and the portrait limit
    # (Cms\ValueObject\PhotoUploadLimits). Reasons: the comments in .env.
    app.media_max_pixels: '%env(int:MEDIA_MAX_PIXELS)%'
    app.media_max_portrait_ratio: '%env(float:MEDIA_MAX_PORTRAIT_RATIO)%'
    # Venue content folders (S8, #9) and the import's variant staging directory.
    app.content_root: '%env(resolve:CONTENT_ROOT)%'
    app.import_staging_dir: '%kernel.project_dir%/var/import-staging'
    # Public contact address of the site (Q5); the guest copy's Reply-To (#14).
    site.contact_email: 'hallo@deine-eventlocation.ch'
    # Site and operator (Q5): JSON-LD, title suffix; #18's legal pages reuse them.
    site.name: 'deine-eventlocation.ch'
    # D27: the operator's facts are placeholders until the owner supplies them. app:prod:check-env refuses production while
    # any of them still contains TODO(owner) (CheckProductionEnvCommand::PLACEHOLDER, F7b); replace each value whole.
    site.operator_name: 'TODO(owner): Name der Betreiberin'
    site.operator_street: 'TODO(owner): Strasse und Nummer'
    site.operator_postcode: 'TODO(owner): PLZ'
    site.operator_city: 'TODO(owner): Ort'
    # Q5: the Impressum's UID line (#18).
    site.operator_uid: 'TODO(owner): UID-Nummer'
    # D26: the processors the Datenschutz page lists, in this order (F7b). Each needs a `legal.privacy.processors.<key>` purpose
    # in the shared catalogue (LegalPagesTest); the prose sections below the list give the details.
    site.processors:
        - { key: infomaniak, name: 'Infomaniak Network SA', location: 'Schweiz' }
        - { key: neon, name: 'Neon (Databricks, Inc.)', location: 'Frankfurt, Deutschland' }  # aws-eu-central-1
        - { key: sentry, name: 'Sentry (Functional Software, Inc.)', location: 'Frankfurt, Deutschland' }
        - { key: google, name: 'Google Ireland Limited', location: 'Irland' }
        # G15: a venue's Vimeo videos, loaded on the visitor's click only (YouTube is Google's, above).
        - { key: vimeo, name: 'Vimeo.com, Inc.', location: 'USA' }
    # LEG-2: app:inquiries:purge deletes inquiries older than this (#18 documents it).
    inquiries.retention_months: 12
    # #17: a canton, town or building landing page exists from this many published venues, below it 404 (one rule, #26 reads it).
    landing.min_venues: 5
    # G12 (D21): a live landing page is indexable (sitemap, llms.txt, no noindex) from this many entries that
    # pass Venues\VenueIndexGate (facts checked, description written), and in a canton only in a launch region
    # (LandingQualityGate). Below it the page answers 200 with `noindex, follow`.
    landing.index_min_venues: 8
    # G12 (D21): the launch regions. Canton, town and event-in-canton pages elsewhere stay live but noindex.
    landing.launch_cantons: [zh, ag, zg, be]
    # Q18, #36: the home page's hero, the SHA-256 of the original file of a venue photo. No published
    # photo with this hash: the hero is the first Spotlight card's photo (HomeHero::fromCards).
    home.hero_photo: cfbf9375b66ff088996ab8a64d99552e0caac0dcd0ca86189a54e4858c8b96d1
    # Temporary, pre-launch: robots.txt opens with `User-agent: Googlebot` + `Disallow: /`; every other
    # crawler (the LLM ones included) keeps the normal rules (Seo\Controller\RobotsController).
    # Set to false at launch and drop the Googlebot group from RobotsTxtTest::test_the_exact_body.
    seo.robots_block_google: true
    # D12, places-photos: Google Places calls per day, site-wide (limiter `google_places`). A page view of a
    # venue without own photos costs one Place Details call plus one media call per photo shown (at most
    # GooglePlacesPhotos::MAX_PHOTOS, 4), so 300 serve about 60 such views a day. Raise it with the Places budget.
    google_places.daily_requests: 300
    # #47: the beacon's day files and the visitor-hash salts (Stats\StatsPaths). var/ survives a deploy.
    stats.dir: '%kernel.project_dir%/var/stats'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Shared\Messenger\CommandHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: command.bus }]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Entity/'

    # S10 (#19): every purge empties the whole HttpCache store.
    App\Venues\HttpCachePurger: '@App\Venues\StoreClearingHttpCachePurger'

    # The one-off geocoder (app:venues:geocode); the key is empty unless the shell sets it.
    App\Venues\VenueGeocoder:
        arguments:
            $apiKey: '%env(string:default::GOOGLE_PLACES_API_KEY)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    parameters:
        # DemoStory's 60 venues give a handful of canton pages at 3 (S11 checks on the dev site).
        landing.min_venues: 3
        # G12: DemoStory checks most entries, so a few launch-region pages are indexable and others show the gate.
        landing.index_min_venues: 2

when@test:
    parameters:
        # Tests never touch the dev demo files.
        app.media_public_dir: '%kernel.project_dir%/var/test-media/public'
        # tests/bootstrap.php wipes var/cache/test, so every run starts with an empty spool.
        stats.dir: '%kernel.cache_dir%/stats'
        # G12: the landing fixtures build pages of landing.min_venues (5) entries; the gate's own tests set 8.
        landing.index_min_venues: 5

    services:
        # Tests assert the Venues handlers' purges (S10, #9 P24) through the real container;
        # the recorder then delegates to the real purger (#19), so the test env runs the real invalidation.
        App\Tests\Support\Http\RecordingHttpCachePurger:
            autowire: true
            public: true
        App\Venues\HttpCachePurger: '@App\Tests\Support\Http\RecordingHttpCachePurger'
        # A second handler of the after-commit messages, for AfterCommitTest (#25).
        App\Tests\Support\Messenger\AfterCommitSpy:
            public: true
            arguments: ['@doctrine.dbal.default_connection']
            tags:
                - { name: messenger.message_handler, bus: command.bus, handles: App\Venues\Command\RemoveVenueFiles }
                - { name: messenger.message_handler, bus: command.bus, handles: App\Venues\Command\PurgeVenueCache }
                - { name: messenger.message_handler, bus: command.bus, handles: App\Venues\Command\PurgeListingsCache }
        # TimelineTypesPinTest and ExtensionPointsTest read the registry from the container (#27b).
        App\Admin\Extension\TimelineActivityTypeRegistry:
            autowire: true
            public: true
        App\Crm\ReadModel\TimelineQuery:
            autowire: true
            public: true
        # The transport of every HTTP client in tests (framework.yaml, when@test, #32 PD10).
        App\Tests\Support\Http\WixImageResponses:
            public: true
        # D12, places-photos: Google's hosts resolve to a public stub address, so no test asks DNS.
        App\Tests\Support\Http\StubHostResolver:
            calls:
                - [byDefault, ['93.184.216.34']]
        App\Venues\GooglePlacesPhotos:
            autowire: true
            arguments:
                $resolver: '@App\Tests\Support\Http\StubHostResolver'
        # VenueGooglePhotosTest uses up the daily cap without 300 requests.
        test.limiter.google_places:
            alias: limiter.google_places
            public: true
