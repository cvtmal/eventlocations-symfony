# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Originals (S9): MEDIA_ROOT; generated variants and published PDFs: public/media/<venue-number>/.
    app.media_root: '%env(resolve:MEDIA_ROOT)%'
    app.media_public_dir: '%kernel.project_dir%/public/media'
    # Venue content folders (S8, #9) and the import's variant staging directory.
    app.content_root: '%env(resolve:CONTENT_ROOT)%'
    app.import_staging_dir: '%kernel.project_dir%/var/import-staging'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Shared\Messenger\CommandHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: command.bus }]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Entity/'

    # S10: no HTTP cache yet; #19 points this alias at its proxy's purge (#9 P24).
    App\Venues\HttpCachePurger: '@App\Venues\NullHttpCachePurger'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Tests never touch the dev demo files.
        app.media_public_dir: '%kernel.project_dir%/var/test-media/public'

    services:
        # Tests assert the Venues handlers' purges (S10, #9 P24) through the real container.
        App\Tests\Support\Http\RecordingHttpCachePurger:
            public: true
        App\Venues\HttpCachePurger: '@App\Tests\Support\Http\RecordingHttpCachePurger'
