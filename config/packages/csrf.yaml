# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit
            # Header-based check only (Sec-Fetch-Site, Origin, Referer): the forms render into
            # cached pages, so there is no JS double-submit cookie.
            field_attr: {}

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
