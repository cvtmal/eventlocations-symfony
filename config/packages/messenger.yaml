framework:
    messenger:
        # Single bus, synchronous: there is no async transport; mail is sent synchronously (#14).
        # dispatch_after_current_bus is part of the default middleware.
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    # Resets a closed EntityManager so one failed command does not break the
                    # next (app:venues:import, #9). The stock doctrine_ping_connection does this
                    # only for messages consumed by a worker.
                    - App\Shared\Messenger\ResetClosedEntityManagerMiddleware
                    - doctrine_transaction
