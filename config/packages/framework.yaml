# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Only the back office and /konto ever start one (S10, S12): the cookie is scoped to /admin, and
    # /konto's name and path are set by Portal\Security\PortalSessionStorageFactory and
    # PortalResponseHeadersListener, so public URLs never see either. 7200 s matches the 2-hour idle
    # timeout (Admin\EventListener\IdleTimeoutListener); PHP's default of 1440 s would end sessions
    # after 24 idle minutes.
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_path: /admin
        cookie_samesite: strict
        cookie_secure: auto
        cookie_httponly: true
        cookie_lifetime: 0
        gc_maxlifetime: 7200

    #esi: true
    #fragments: true

    # Wix's media server, for app:owner:export-content's photos (#32). One request at a time is
    # the caller's rule (Venues\WixPhotoCache); retries cover 5xx, 429 and transport errors.
    http_client:
        scoped_clients:
            wix.client:
                base_uri: 'https://static.wixstatic.com'
                timeout: 30
                max_duration: 300
                retry_failed:
                    max_retries: 3

when@test:
    framework:
        test: true
        # Replaces the transport under every client, so no test can reach Wix (#32 PD10).
        http_client:
            mock_response_factory: App\Tests\Support\Http\WixImageResponses
            scoped_clients:
                wix.client:
                    base_uri: 'https://static.wixstatic.com'
                    retry_failed:
                        delay: 0
        session:
            storage_factory_id: session.storage.factory.mock_file

# S10 (#19): Symfony's HttpCache in front of the app, in prod only; dev and test stay uncached,
# and public/index.php is unchanged (the kernel hands the main request to the http_cache service).
# The store is %kernel.share_dir%/http_cache; every purge invalidates it (Shared\Http\HttpCacheClearer).
# HttpCache passes the visitor's IP on itself (SubRequestHandler), so the limiters need no
# trusted_proxies; a proxy that terminates TLS in front of PHP needs SYMFONY_TRUSTED_PROXIES (#20).
#
# #20, PD3: production answers only for its own hosts (a test pins this). trusted_proxies stays
# Symfony's default, %env(default::SYMFONY_TRUSTED_PROXIES)%: the host sets that variable only if
# Phase 0's probe shows a proxy in front of PHP, and these headers then take effect by themselves.
# HttpCache swallows the kernel's host check, so Shared\Http\TrustedHostGuard runs it in front of the cache.
when@prod:
    framework:
        http_cache:
            enabled: true
            trace_level: short
            trace_header: X-Symfony-Cache
            default_ttl: 0
            allow_reload: false
            allow_revalidate: false
        trusted_hosts: ['^hochzeitslocation\.ch$', '^www\.hochzeitslocation\.ch$']
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']
