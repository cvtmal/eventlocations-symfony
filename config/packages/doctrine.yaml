doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        server_version: '18'
        persistent: true

        profiling_collect_backtrace: '%kernel.debug%'

        types:
            # Overrides the built-in type: also accepts PostgreSQL values with microseconds.
            datetimetz_immutable: App\Shared\Doctrine\Type\FlexibleDateTimeTzImmutableType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Geo:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Geo/Entity'
                prefix: 'App\Geo\Entity'
                alias: Geo
            Inquiries:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inquiries/Entity'
                prefix: 'App\Inquiries\Entity'
                alias: Inquiries
            Venues:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Venues/Entity'
                prefix: 'App\Venues\Entity'
                alias: Venues
            Admin:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Admin/Entity'
                prefix: 'App\Admin\Entity'
                alias: Admin
            Cms:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Entity'
                prefix: 'App\Cms\Entity'
                alias: Cms
            Crm:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Crm/Entity'
                prefix: 'App\Crm\Entity'
                alias: Crm

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
            persistent: false

when@prod:
    doctrine:
        dbal:
            # DBAL drops connect_timeout from the URL; pdo_pgsql turns this attribute into libpq's
            # connect_timeout (30 s without it), and 10 s leaves room for a Neon wake from suspend.
            # channel_binding is dropped too, so production sets PGCHANNELBINDING in .env.local and
            # Shared\Doctrine\Middleware\ChannelBindingMiddleware hands that one variable to libpq (#20).
            options:
                !php/const PDO::ATTR_TIMEOUT: 10
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
