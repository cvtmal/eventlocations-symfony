twig:
    file_name_pattern: '*.twig'
    # Display only: storage and PHP stay UTC.
    date:
        timezone: Europe/Zurich
    mailer:
        html_to_text_converter: App\Shared\Mailer\EmailHtmlToTextConverter
    # A parameter, so the footer of an error page still runs no query.
    globals:
        site_contact_email: '%site.contact_email%'

when@test:
    twig:
        strict_variables: true
