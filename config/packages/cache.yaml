framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys. Fixed, because the
        # default seeds with kernel.project_dir, which is releases/<sha> in production (F15): every
        # deploy would start new limiter counters and snapshots, and a rollback would read stale ones.
        prefix_seed: deine-eventlocation

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
        pools:
            # #17: the footer's canton links, written by LandingPages when they change, read by
            # error pages that must not query. No expiry: a stale list is replaced on the next listing view.
            cache.landing_pages:
                adapter: cache.app
                default_lifetime: 0
            # #26: every content_blocks row as one item `snapshot` (build time, locale → key → Markdown),
            # read by Shared\ReadModel\ContentBlocks. No expiry, so a page that only peeks keeps the
            # footer note; the reader itself rebuilds a snapshot older than a day.
            cache.content_blocks:
                adapter: cache.app
                default_lifetime: 0
