# Hotspot of #22 and #42: two firewalls, `admin` for the back office and `portal` for the manager accounts.
# Nothing outside ^/admin(/|$) and ^/konto(/|$) has one, so public pages stay structurally free of sessions
# (S10). Other cycles do not edit this file: they use #[IsGranted]. One named exception: #44 adds its
# `entry_point` and `access_denied_handler` lines under `firewalls.portal`.
security:
    password_hashers:
        App\Admin\Security\AdminIdentity: auto
        App\Portal\Security\PortalIdentity: auto

    providers:
        admin_users:
            id: App\Admin\Security\AdminUserProvider
        portal_users:
            id: App\Portal\Security\PortalUserProvider

    role_hierarchy:
        ROLE_ADMIN: [ROLE_EDITOR]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        admin:
            pattern: ^/admin(/|$)
            lazy: true
            provider: admin_users
            entry_point: App\Admin\Security\AdminEntryPoint
            access_denied_handler: App\Admin\Security\AdminAccessDeniedHandler
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_dashboard
                username_parameter: _username
                password_parameter: _password
            custom_authenticators:
                - App\Admin\Security\DevAutoLoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: /admin/logout
                target: admin_login
                enable_csrf: true
            two_factor:
                auth_form_path: admin_2fa_login
                check_path: admin_2fa_check
                default_target_path: admin_dashboard
                failure_handler: App\Admin\Security\TotpFailureHandler
                enable_csrf: true
                prepare_on_login: true
                prepare_on_access_denied: true
        portal:
            pattern: ^/konto(/|$)
            lazy: true
            provider: portal_users
            entry_point: App\Portal\Security\PortalEntryPoint
            access_denied_handler: App\Portal\Security\PortalAccessDeniedHandler
            form_login:
                login_path: portal_login
                check_path: portal_login
                enable_csrf: true
                default_target_path: portal_home
                username_parameter: _username
                password_parameter: _password
            custom_authenticators:
                - App\Portal\Security\DevAutoLoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: /konto/abmelden
                target: portal_login
                enable_csrf: true

    # Only the first matching rule applies. The enrolment page is used by a fully authenticated user who
    # has no secret yet, so the 2FA rule matches the form and the check path exactly. Logout must be
    # reachable during the code step ("Abbrechen"): a lazy firewall checks access before it logs out.
    # The last /konto line closes every later route by default, so a new public page has to be named here.
    # ^/konto/api/ stands on its own for #44: the access listener runs at kernel.request and
    # #[IsCsrfTokenValid] at kernel.controller_arguments, so an anonymous JSON write never reaches the CSRF
    # check.
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/2fa(/check)?$, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin(/|$), roles: ROLE_EDITOR }
        - { path: ^/konto/(anmelden|abmelden|registrieren|passwort-vergessen)$, roles: PUBLIC_ACCESS }
        - { path: ^/konto/passwort-neu/[^/]+$, roles: PUBLIC_ACCESS }
        # G9: the cancellation link of the reminder mail works without a login.
        - { path: ^/konto/abo-kuendigen/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/konto/api/, roles: ROLE_PORTAL_USER }
        - { path: ^/konto(/|$), roles: ROLE_PORTAL_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Admin\Security\AdminIdentity:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            App\Portal\Security\PortalIdentity:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
