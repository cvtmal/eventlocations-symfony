# Rate limiters (#8 venue-detail-page). `phone_reveal` guards GET /hochzeitslocation/{slug}/telefon
# (DP-11): 20 reveals per 10 minutes per client IP. The `lock_factory: auto` default picks up
# lock.factory (lock.yaml, #20), so consumption is serialised per key and parallel requests cannot
# all read the same count; the state lives in its own cache pool.
# `inquiry_submit` (#14, IQ-3) guards POST /hochzeitslocation/{slug}/anfrage: 5 inquiries per hour
# per client IP, consumed only after the form is valid and the fill time has passed.
# `portal_register` (#42) guards every /konto form that can send a mail (register, forgot):
# 5 per hour per client IP, one budget across the three, consumed only after the form is valid.
# The IP limiters are keyed by Shared\Security\ClientIpKey, never the raw IP: the key lands in a lock
# file's name and in the cached state.
# `portal_upload` (#44) guards POST /konto/api/locations/{number}/photos: 60 per hour per manager id,
# a UUID, so it needs no ClientIpKey. Every attempt counts, a refused file too; staff are not limited.
# `stats_collect` (#47) guards POST /_stats, the statistics beacon: 120 sends per 10 minutes per client
# IP. Over the limit the beacon gets its 204 and nothing is written. Filesystem only, so no Neon.
framework:
    rate_limiter:
        phone_reveal:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            cache_pool: cache.phone_reveal
        inquiry_submit:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.inquiry_submit
        portal_register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.portal_register
        portal_upload:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
            cache_pool: cache.portal_upload
        stats_collect:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
            cache_pool: cache.stats_collect
    cache:
        pools:
            cache.phone_reveal:
                adapter: cache.app
            cache.inquiry_submit:
                adapter: cache.app
            cache.portal_register:
                adapter: cache.app
            cache.portal_upload:
                adapter: cache.app
            cache.stats_collect:
                adapter: cache.app

# Tests clear the pools in setUp(): an array adapter would not work there, because the test client
# resets services (and so array pools) between requests.
