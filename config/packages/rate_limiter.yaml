# Rate limiters (#8 venue-detail-page). `phone_reveal` guards GET /hochzeitslocation/{slug}/telefon
# (DP-11): 20 reveals per 10 minutes per client IP. No lock (symfony/lock is not installed, so the
# `lock_factory: auto` default resolves to none); the state lives in its own cache pool.
framework:
    rate_limiter:
        phone_reveal:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            cache_pool: cache.phone_reveal
    cache:
        pools:
            cache.phone_reveal:
                adapter: cache.app

# Tests clear the pool in setUp(): an array adapter would not work there, because the test client
# resets services (and so array pools) between requests.
