; PHP settings of the production web process on Hostpoint (#20). Versioned on purpose: never use
; the panel's "PHP settings", because it writes this same file into the app directory and the next
; deploy replaces it. A change takes effect after user_ini.cache_ttl (300 s by default).
;
; PHP reads this file in every php-fpm, so it also applies to the local Compose stack. PHPUnit and
; console commands run on the CLI and never read it.

; memory_limit and #25's MEDIA_MAX_PIXELS move together: the pixel limit is what keeps a decoded
; upload inside this memory.
memory_limit=256M
upload_max_filesize=25M
post_max_size=26M
; The host encodes AVIF slower than a developer machine.
max_execution_time=120
; The SMTP timeout: Symfony's SocketStream falls back to this value and the mailer DSN has no such
; option. It bounds each blocking read, so a hanging mail server costs a worker about 10 s, not 60.
default_socket_timeout=10
; With errors on, an oversize POST turns into a broken 200.
display_errors=Off
log_errors=On
; PHP_INI_SYSTEM: PHP ignores it in a .user.ini, so public/.htaccess unsets X-Powered-By.
expose_php=Off
; Keeps call arguments out of exception traces: send_default_pii does not cover them, so a failed
; query's bound values (an inquiry's e-mail or message) would otherwise reach Sentry.
zend.exception_ignore_args=On
